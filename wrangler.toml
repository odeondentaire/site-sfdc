# Configuration Cloudflare Pages – site de la SFDC
name = "site-sfdc"
compatibility_date = "2025-09-01"
pages_build_output_dir = "dist"

# Bucket R2 : formulaires (contact et demandes d’adhésion), documents PDF, médias.
[[r2_buckets]]
binding = "SFDC_BUCKET"
bucket_name = "database-sfdc"


[vars]
# Destinataire des e-mails de demande d'adhésion
NOTIFY_TO = "sfdc.dentcancer@gmail.com"
# Expéditeur : adresse du domaine sfdc-cancer.fr authentifiée dans Brevo
NOTIFY_FROM = "site@sfdc-cancer.fr"
# La clé BREVO_API_KEY est un secret : à créer dans Cloudflare, jamais dans ce fichier.
